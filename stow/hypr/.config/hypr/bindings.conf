$mod = SUPER
$ipc = qs -c noctalia-shell ipc

# 1. Application bindings
# Launch primary applications with $mod + key
bind = $mod, RETURN, exec, warp-terminal    #"Terminal"
bind = $mod, E, exec, nautilus    #"File Manager"
bind = $mod, B, exec, zen-browser    #"Browser"
bind = $mod, N, exec, zeditor    #"Editor"
bind = $mod, M, exec, flatpak run com.spotify.Client    #"Music"
bind = $mod, A, exec, flatpak run io.anytype.anytype    #"Anytype"
bind = $mod, D, exec, zeditor ~/dotfiles    #"Dotfiles"
bind = $mod, R, exec, localsend    #"Share"

# Launch special applications with $mod + ALT + key
bind = $mod ALT, B, exec, zen-browser --private-window    #"Private Browser"
bind = $mod ALT, E, exec, $ipc call launcher emoji    #"Emoji Picker"
bind = $mod ALT, Z, exec, $ipc call plugin:zed-provider toggle    #"Zed Provider"
bind = $mod ALT, S, exec, kitty --class org.float.surge -T Surge --hold -e sh -lc '. ~/.profile && /home/shiraneko/go/bin/Surge connect "$SURGE_HOST" --token "$SURGE_TOKEN"'    #"Surge"
bind = $mod ALT, T, exec, kitty --class org.float.btop -T BTOP -e btop    #"Btop"
bind = $mod ALT, D, exec, /home/shiraneko/.local/bin/ABDownloadManager --class org.float.abdm    #"ABDownloadManager"

# 2. Clipboard
# Standard copy/paste operations
bindd = $mod, C, Universal copy, sendshortcut, CTRL, Insert,        #"Universal Copy"
bindd = $mod, V, Universal paste, sendshortcut, SHIFT, Insert,      #"Universal Paste"
bindd = $mod, X, Universal cut, sendshortcut, CTRL, X,      #"Universal Cut"

# Advanced clipboard features
bind = $mod CTRL, V, exec, $ipc call plugin:clipper toggle    #"Clipboard Manager"
bind = $mod CTRL, C, exec, $ipc call plugin:clipper addSelectionToNoteCard    #"Add to NoteCard"
bind = $mod SHIFT, V, exec, $ipc call launcher clipboard    #"Noctalia Clipboard"

# 3. Workspace
# Navigate workspaces with $mod + number
bind = $mod, 1, workspace, 1    #"Workspace 1"
bind = $mod, 2, workspace, 2    #"Workspace 2"
bind = $mod, 3, workspace, 3    #"Workspace 3"
bind = $mod, 4, workspace, 4    #"Workspace 4"
bind = $mod, 5, workspace, 5    #"Workspace 5"
bind = $mod, 6, workspace, 6    #"Workspace 6"
bind = $mod, 7, workspace, 7    #"Workspace 7"
bind = $mod, 8, workspace, 8    #"Workspace 8"
bind = $mod, 9, workspace, 9    #"Workspace 9"
bind = $mod, 0, workspace, 10    #"Workspace 10"

# Move window to workspace with follow using $mod + CTRL
bind = $mod CTRL, 1, movetoworkspace, 1    #"Move to Workspace 1"
bind = $mod CTRL, 2, movetoworkspace, 2    #"Move to Workspace 2"
bind = $mod CTRL, 3, movetoworkspace, 3    #"Move to Workspace 3"
bind = $mod CTRL, 4, movetoworkspace, 4    #"Move to Workspace 4"
bind = $mod CTRL, 5, movetoworkspace, 5    #"Move to Workspace 5"
bind = $mod CTRL, 6, movetoworkspace, 6    #"Move to Workspace 6"
bind = $mod CTRL, 7, movetoworkspace, 7    #"Move to Workspace 7"
bind = $mod CTRL, 8, movetoworkspace, 8    #"Move to Workspace 8"
bind = $mod CTRL, 9, movetoworkspace, 9    #"Move to Workspace 9"
bind = $mod CTRL, 0, movetoworkspace, 10    #"Move to Workspace 10"

# Move window to workspace silently using $mod + ALT
bind = $mod ALT, 1, movetoworkspacesilent, 1    #"Move to Workspace 1 (Silent)"
bind = $mod ALT, 2, movetoworkspacesilent, 2    #"Move to Workspace 2 (Silent)"
bind = $mod ALT, 3, movetoworkspacesilent, 3    #"Move to Workspace 3 (Silent)"
bind = $mod ALT, 4, movetoworkspacesilent, 4    #"Move to Workspace 4 (Silent)"
bind = $mod ALT, 5, movetoworkspacesilent, 5    #"Move to Workspace 5 (Silent)"
bind = $mod ALT, 6, movetoworkspacesilent, 6    #"Move to Workspace 6 (Silent)"
bind = $mod ALT, 7, movetoworkspacesilent, 7    #"Move to Workspace 7 (Silent)"
bind = $mod ALT, 8, movetoworkspacesilent, 8    #"Move to Workspace 8 (Silent)"
bind = $mod ALT, 9, movetoworkspacesilent, 9    #"Move to Workspace 9 (Silent)"
bind = $mod ALT, 0, movetoworkspacesilent, 10    #"Move to Workspace 10 (Silent)"

# Workspace navigation
bind = $mod, TAB, workspace, e+1    #"Next Workspace"
bind = $mod SHIFT, TAB, workspace, e-1    #"Previous Workspace"
bind = $mod CTRL, TAB, workspace, previous    #"Last Workspace"

# Move workspace to monitor
bind = $mod CTRL ALT, LEFT, movecurrentworkspacetomonitor, l    #"Move to Left Monitor"
bind = $mod CTRL ALT, RIGHT, movecurrentworkspacetomonitor, r    #"Move to Right Monitor"
bind = $mod CTRL ALT, UP, movecurrentworkspacetomonitor, u    #"Move to Top Monitor"
bind = $mod CTRL ALT, DOWN, movecurrentworkspacetomonitor, d    #"Move to Bottom Monitor"

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1    #"Next Workspace"
bind = $mod, mouse_up, workspace, e-1    #"Previous Workspace"


# 4. Scratchpad
# Toggle scratchpad visibility
bind = $mod, S, togglespecialworkspace, scratchpad    #"Toggle Scratchpad"

# Move to scratchpad with follow
bind = $mod CTRL, S, movetoworkspace, special:scratchpad    #"Move to Scratchpad"

# Move to scratchpad silently
bind = $mod CTRL ALT, S, movetoworkspacesilent, special:scratchpad    #"Move to Scratchpad (Silent)"


# 5. Window Management
# Basic window actions
bind = $mod, Q, killactive    #"Close Window"
bind = $mod, F, fullscreen, 0    #"Fullscreen"
bind = $mod, T, togglefloating    #"Toggle Floating"
bind = $mod, P, pseudo    #"Pseudo Tiling"
bind = $mod, G, togglegroup    #"Toggle Group"

# Tiled fullscreen variants
bind = $mod CTRL, F, fullscreenstate, 0 2    #"Tiled Fullscreen"
bind = $mod ALT, F, fullscreen, 1    #"Fullscreen Width"

# Split operations
bind = $mod, J, layoutmsg, togglesplit    #"Toggle Split"


# 6. Window Movement (Current Workspace)
# Swap windows within current workspace
bind = $mod SHIFT, LEFT, swapwindow, l    #"Swap Left"
bind = $mod SHIFT, RIGHT, swapwindow, r    #"Swap Right"
bind = $mod SHIFT, UP, swapwindow, u    #"Swap Up"
bind = $mod SHIFT, DOWN, swapwindow, d    #"Swap Down"

# 7. Focus Navigation
# Move focus between windows
bind = $mod, left, layoutmsg, focus l    #"Focus Left"
bind = $mod, right, layoutmsg, focus r    #"Focus Right"
bind = $mod, up, layoutmsg, focus u    #"Focus Up"
bind = $mod, down, layoutmsg, focus d    #"Focus Down"

# Cycle through windows
bind = ALT, TAB, cyclenext    #"Next Window"
bind = ALT SHIFT, TAB, cyclenext, prev    #"Previous Window"
bind = ALT, TAB, bringactivetotop    #"Bring to Front"

# 8. Resize & Layout
# Expand to fill workspace (100% width)
bind = $mod, equal, exec, hyprctl dispatch layoutmsg promote; hyprctl dispatch layoutmsg colresize all 1    #"Expand to Fill"
# Shrink to half (50% width)
bind = $mod, minus, exec, hyprctl dispatch layoutmsg colresize all 0.5    #"Shrink to Half"

# Resize columns
bind = $mod ALT, left, layoutmsg, colresize -0.1    #"Shrink Column"
bind = $mod ALT, right, layoutmsg, colresize +0.1    #"Expand Column"

# Resize active window
bind = $mod ALT, minus, resizeactive, 0 -50    #"Shrink Height"
bind = $mod ALT, equal, resizeactive, 0 50    #"Expand Height"

# 9. Groups
# Move in/out of groups
bind = $mod ALT, G, moveoutofgroup    #"Leave Group"

# Move window into group direction
bind = $mod ALT, LEFT, moveintogroup, l    #"Move to Left Group"
bind = $mod ALT, RIGHT, moveintogroup, r    #"Move to Right Group"
bind = $mod ALT, UP, moveintogroup, u    #"Move to Top Group"
bind = $mod ALT, DOWN, moveintogroup, d    #"Move to Bottom Group"

# Navigate within group
bind = $mod ALT, TAB, changegroupactive, f    #"Next in Group"
bind = $mod ALT SHIFT, TAB, changegroupactive, b    #"Previous in Group"

# Group window selection by number
bind = $mod ALT, 1, changegroupactive, 1    #"Group Window 1"
bind = $mod ALT, 2, changegroupactive, 2    #"Group Window 2"
bind = $mod ALT, 3, changegroupactive, 3    #"Group Window 3"
bind = $mod ALT, 4, changegroupactive, 4    #"Group Window 4"
bind = $mod ALT, 5, changegroupactive, 5    #"Group Window 5"

# Scroll through group
bind = $mod ALT, mouse_down, changegroupactive, f    #"Next in Group"
bind = $mod ALT, mouse_up, changegroupactive, b    #"Previous in Group"


# 10. Mouse Actions
# Drag and resize with mouse
bindm = $mod, mouse:272, movewindow    #"Move Window"
bindm = $mod, mouse:273, resizewindow    #"Resize Window"

# 11. System Utilities
# Launcher and menus
bind = $mod, SPACE, exec, $ipc call launcher toggle    #"App Launcher"
bind = $mod, ESCAPE, exec, $ipc call sessionMenu toggle    #"System Menu"
bind = $mod, K, exec, $ipc call plugin togglePanel keybind-cheatsheet    #"Keybind Cheatsheet"

# Lock and session
bind = $mod, L, exec, $ipc call sessionMenu lock    #"Lock Screen"
bind = $mod SHIFT, Q, exec, $ipc call sessionMenu lockAndSuspend    #"Lock & Suspend"

# Settings
bind = $mod, COMMA, exec, $ipc call settings open    #"Settings"

# Calculator
bind = ,XF86Calculator, exec, gnome-calculator    #"Calculator"

# Dictation
bind = $mod CTRL, X, exec, voxtype record toggle    #"Dictation"

# 12. Toggles
# System toggles
bind = $mod CTRL, N, exec, $ipc call nightLight toggle    #"Nightlight"
bind = $mod CTRL, P, exec, $ipc call powerProfile cycle    #"Performance Mode"
bind = $mod SHIFT, P, exec, $ipc call powerProfile toggleNoctaliaPerformance    #"Noctalia Performance"
bind = $mod CTRL, Z, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')    #"Zoom In"
bind = $mod CTRL ALT, Z, exec, hyprctl keyword cursor:zoom_factor 1    #"Zoom Reset"

# 13. Media
# Volume controls
bind = ,XF86AudioRaiseVolume, exec, $ipc call volume increase    #"Volume Up"
bind = ,XF86AudioLowerVolume, exec, $ipc call volume decrease    #"Volume Down"
bind = ,XF86AudioMute, exec, $ipc call volume muteOutput    #"Mute"

# Playback controls
bind = ,XF86AudioNext, exec, $ipc call media next    #"Next Track"
bind = ,XF86AudioPrev, exec, $ipc call media previous    #"Previous Track"
bind = ,XF86AudioPlay, exec, $ipc call media playPause    #"Play/Pause"
bind = ,XF86AudioPause, exec, $ipc call media playPause    #"Play/Pause"

# 14. Captures
# Screenshots (copies to clipboard)
bind = ,PRINT, exec, grim - | wl-copy    #"Screenshot Full"
bind = ALT, PRINT, exec, hyprshot -m window --clipboard-only --silent    #"Screenshot Window"
bind = CTRL, PRINT, exec, hyprshot -m region --clipboard-only --silent    #"Screenshot Region"

# Screen recording
bind = $mod, PRINT, exec, $ipc call plugin:screen-recorder toggle    #"Screen Recording"
